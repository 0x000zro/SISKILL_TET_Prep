name: SISKILL Content Validation & Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate_content:
    name: Validate Pedagogy Schemas & Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema fastjsonschema

      - name: Validate Master Manifest JSON
        run: |
          python -c 'import json; json.load(open("app/src/main/assets/bundled_content/master_manifest.json", encoding="utf-8")); print("[OK] Valid JSON master_manifest.json")'

  build_android:
    name: Build Android APK
    needs: validate_content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: siskill-tet-prep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
